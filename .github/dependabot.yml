# Opens one PR per version bump, so each bump lands as its own commit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, to sit out compromised or yanked versions.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: deps
    ignore:
      # typescript-eslint supports TypeScript below 6.x only; take a new major once it does
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types for the Node the site runs on (.nvmrc is Node 24), not a newer one
      - dependency-name: '@types/node'
        versions: ['>=25']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
