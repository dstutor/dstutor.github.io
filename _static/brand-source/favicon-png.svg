<!-- Source for the favicon PNGs in _static/dstutor-brand/. It is favicon.svg with fixed colors (a PNG
     cannot follow prefers-color-scheme) and a light halo behind each eye, so the dark eyes still read
     on dark tab bars and on iOS's black home-screen background.
     Regenerate:  for n in 16 32 48 180; do rsvg-convert -w $n -h $n favicon-png.svg -o ../dstutor-brand/favicon-$n.png; done
     favicon.ico holds favicon-16/32/48.png as its three PNG entries. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="8 2 104 96"><path d="M40 10 H18 V90 H40" fill="none" stroke="#F37726" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 10 H102 V90 H80" fill="none" stroke="#F37726" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="52" r="13.5" fill="#F7F9FD"/><circle cx="73" cy="52" r="13.5" fill="#F7F9FD"/><circle cx="47" cy="52" r="10.5" fill="#1E2A38"/><circle cx="73" cy="52" r="10.5" fill="#1E2A38"/><circle cx="50.5" cy="48.5" r="4.4" fill="#FFFFFF"/><circle cx="76.5" cy="48.5" r="4.4" fill="#FFFFFF"/></svg>
